<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="google-site-verification" content="7cHDOJHbwxKIKWLvEzMHCzsI2NZ_C9_ZDhW2cmlApgY" />

    <title>
        {% block title %}
        Friends School Mbale
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}?v=3">


<!-- Friends School – Mbale icons -->
<link rel="icon" href="{{ url_for('static', filename='images/school-icon.png') }}" type="image/png">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/school-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
<meta name="theme-color" content="#123B70">

</head>

<body>

    <!-- HAMBURGER NAVIGATION -->
<nav class="navbar">

    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-menu" id="navMenu">

        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('academics') }}">Academics</a>
        <a href="{{ url_for('news') }}">News</a>
        <a href="{{ url_for('gallery') }}">Gallery</a>
        <a href="{{ url_for('fees') }}">💳 Payments</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('admin_login') }}">🔐 Admin Login</a>

    </div>

</nav>


            <!-- PAGE CONTENT -->

    <main>

        {% block content %}

        {% endblock %}

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}?v=3"></script>


    <section id="school-assistant" class="school-assistant" aria-label="School information assistant">
      <button id="assistant-toggle" class="assistant-toggle" type="button" aria-expanded="false" aria-controls="assistant-panel">Ask School Assistant</button>
      <div id="assistant-panel" class="assistant-panel" hidden>
        <div class="assistant-heading"><strong>School Assistant</strong><button id="assistant-close" type="button" aria-label="Close assistant">×</button></div>
        <p class="assistant-note">Answers are based on public information on this website. Do not enter student or private information.</p>
        <div id="assistant-answer" class="assistant-answer" aria-live="polite">Hello! Ask about academics, resources, fees, news or contacts.</div>
        <form id="assistant-form"><label for="assistant-message">Your question</label><input id="assistant-message" name="message" maxlength="500" required placeholder="How do I find learning resources?"><button type="submit">Ask</button></form>
      </div>
    </section>
    <script src="{{ url_for('static', filename='js/assistant.js') }}" defer></script>
</body>

</html>
